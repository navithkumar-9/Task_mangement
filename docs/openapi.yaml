openapi: 3.0.3
info:
    title: Task Management Platform API
    version: 1.0.0
    description: |
        Swagger/OpenAPI documentation for the Django REST Framework backend used by
        the Admin and Super Admin React portals.

        All secured endpoints use JWT bearer authentication.
servers:
    - url: http://localhost:8000/api
      description: Local Django API
tags:
    - name: Authentication
    - name: Profile
    - name: Users
    - name: Tasks
    - name: Timesheets
    - name: Comments
    - name: Subtasks
    - name: Notifications
    - name: Announcements

paths:
    /super-admin/login/:
        post:
            tags: [Authentication]
            summary: Super Admin login
            operationId: superAdminLogin
            security: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/SuperAdminLoginRequest'
            responses:
                '200':
                    description: Super Admin login successful.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AuthResponse'
                '401':
                    $ref: '#/components/responses/Unauthorized'

    /login/:
        post:
            tags: [Authentication]
            summary: Admin or Team Member login
            operationId: login
            security: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/LoginRequest'
            responses:
                '200':
                    description: Login successful.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AuthResponse'
                '400':
                    $ref: '#/components/responses/ValidationError'

    /profile/:
        get:
            tags: [Profile]
            summary: Fetch current profile
            operationId: getProfile
            responses:
                '200':
                    description: Profile fetched successfully.
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessResponse'
                                    - type: object
                                      properties:
                                          data:
                                              $ref: '#/components/schemas/Profile'
                '401':
                    $ref: '#/components/responses/Unauthorized'
        put:
            tags: [Profile]
            summary: Update current profile
            operationId: updateProfile
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ProfileUpdateRequest'
            responses:
                '200':
                    description: Profile updated successfully.
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessResponse'
                                    - type: object
                                      properties:
                                          data:
                                              $ref: '#/components/schemas/Profile'
                '401':
                    $ref: '#/components/responses/Unauthorized'

    /create-admin/:
        post:
            tags: [Users]
            summary: Create Admin user
            operationId: createAdmin
            description: Requires Super Admin access.
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreateUserRequest'
            responses:
                '201':
                    description: Admin created successfully.
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessResponse'
                                    - type: object
                                      properties:
                                          data:
                                              $ref: '#/components/schemas/UserCreated'
                '400':
                    $ref: '#/components/responses/ValidationError'
                '403':
                    $ref: '#/components/responses/Forbidden'

    /create-team-member/:
        post:
            tags: [Users]
            summary: Create Team Member
            operationId: createTeamMember
            description: Requires Admin access.
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreateUserRequest'
            responses:
                '201':
                    description: Team Member created successfully.
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessResponse'
                                    - type: object
                                      properties:
                                          data:
                                              $ref: '#/components/schemas/UserCreated'
                '400':
                    $ref: '#/components/responses/ValidationError'
                '403':
                    $ref: '#/components/responses/Forbidden'

    /admins/:
        get:
            tags: [Users]
            summary: List Admin users
            operationId: listAdmins
            description: Requires Super Admin access.
            parameters:
                - $ref: '#/components/parameters/Search'
                - $ref: '#/components/parameters/Page'
                - $ref: '#/components/parameters/PageSize'
            responses:
                '200':
                    description: Paginated Admin list.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/PaginatedAdminUsersResponse'
                '403':
                    $ref: '#/components/responses/Forbidden'

    /admins/{admin_id}/:
        parameters:
            - $ref: '#/components/parameters/AdminId'
        get:
            tags: [Users]
            summary: Fetch Admin user
            operationId: getAdmin
            description: Requires Super Admin access.
            responses:
                '200':
                    description: Admin fetched successfully.
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessResponse'
                                    - type: object
                                      properties:
                                          data:
                                              $ref: '#/components/schemas/AdminUser'
                '404':
                    $ref: '#/components/responses/NotFound'
        put:
            tags: [Users]
            summary: Update Admin user
            operationId: updateAdmin
            description: Requires Super Admin access.
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/UserUpdateRequest'
            responses:
                '200':
                    description: Admin updated successfully.
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessResponse'
                                    - type: object
                                      properties:
                                          data:
                                              $ref: '#/components/schemas/AdminUser'
                '400':
                    $ref: '#/components/responses/ValidationError'
                '404':
                    $ref: '#/components/responses/NotFound'
        delete:
            tags: [Users]
            summary: Delete Admin user
            operationId: deleteAdmin
            description: Requires Super Admin access.
            responses:
                '200':
                    $ref: '#/components/responses/Success'
                '404':
                    $ref: '#/components/responses/NotFound'

    /super-admin/team-members/:
        get:
            tags: [Users]
            summary: List all Team Members
            operationId: listTeamMembersForSuperAdmin
            description: Requires Super Admin access.
            parameters:
                - $ref: '#/components/parameters/Search'
                - $ref: '#/components/parameters/Page'
                - $ref: '#/components/parameters/PageSize'
            responses:
                '200':
                    description: Paginated Team Member list.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/PaginatedTeamMembersResponse'
                '403':
                    $ref: '#/components/responses/Forbidden'

    /super-admin/team-members/{member_id}/:
        parameters:
            - $ref: '#/components/parameters/MemberId'
        get:
            tags: [Users]
            summary: Fetch Team Member as Super Admin
            operationId: getTeamMemberForSuperAdmin
            responses:
                '200':
                    description: Team Member fetched successfully.
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessResponse'
                                    - type: object
                                      properties:
                                          data:
                                              $ref: '#/components/schemas/TeamMember'
                '404':
                    $ref: '#/components/responses/NotFound'
        put:
            tags: [Users]
            summary: Update Team Member as Super Admin
            operationId: updateTeamMemberForSuperAdmin
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/SuperAdminTeamMemberUpdateRequest'
            responses:
                '200':
                    description: Team Member updated successfully.
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessResponse'
                                    - type: object
                                      properties:
                                          data:
                                              $ref: '#/components/schemas/TeamMember'
                '400':
                    $ref: '#/components/responses/ValidationError'
                '404':
                    $ref: '#/components/responses/NotFound'
        delete:
            tags: [Users]
            summary: Delete Team Member as Super Admin
            operationId: deleteTeamMemberForSuperAdmin
            responses:
                '200':
                    $ref: '#/components/responses/Success'
                '404':
                    $ref: '#/components/responses/NotFound'

    /admin/team-members/:
        get:
            tags: [Users]
            summary: List visible Team Members for Admin portal
            operationId: listTeamMembersForAdmin
            description: Requires Admin or permitted Team Member access.
            parameters:
                - $ref: '#/components/parameters/Search'
                - $ref: '#/components/parameters/Page'
                - $ref: '#/components/parameters/PageSize'
            responses:
                '200':
                    description: Paginated Team Member list.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/PaginatedTeamMembersResponse'
                '403':
                    $ref: '#/components/responses/Forbidden'

    /admin/team-members/{member_id}/:
        parameters:
            - $ref: '#/components/parameters/MemberId'
        get:
            tags: [Users]
            summary: Fetch Team Member owned by Admin
            operationId: getTeamMemberForAdmin
            responses:
                '200':
                    description: Team Member fetched successfully.
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessResponse'
                                    - type: object
                                      properties:
                                          data:
                                              $ref: '#/components/schemas/TeamMember'
                '404':
                    $ref: '#/components/responses/NotFound'
        put:
            tags: [Users]
            summary: Update Team Member owned by Admin
            operationId: updateTeamMemberForAdmin
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/UserUpdateRequest'
            responses:
                '200':
                    description: Team Member updated successfully.
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessResponse'
                                    - type: object
                                      properties:
                                          data:
                                              $ref: '#/components/schemas/TeamMember'
                '400':
                    $ref: '#/components/responses/ValidationError'
                '404':
                    $ref: '#/components/responses/NotFound'
        delete:
            tags: [Users]
            summary: Delete Team Member owned by Admin
            operationId: deleteTeamMemberForAdmin
            responses:
                '200':
                    $ref: '#/components/responses/Success'
                '404':
                    $ref: '#/components/responses/NotFound'

    /tasks/create/:
        post:
            tags: [Tasks]
            summary: Create task
            operationId: createTask
            description: Requires Admin or permitted Team Member access.
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/TaskCreateRequest'
            responses:
                '201':
                    description: Task created successfully.
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessResponse'
                                    - type: object
                                      properties:
                                          data:
                                              $ref: '#/components/schemas/Task'
                '400':
                    $ref: '#/components/responses/ValidationError'
                '403':
                    $ref: '#/components/responses/Forbidden'

    /tasks/admin/:
        get:
            tags: [Tasks]
            summary: List managed tasks
            operationId: listAdminTasks
            description: Requires Admin or permitted Team Member access.
            parameters:
                - $ref: '#/components/parameters/Search'
                - name: completed
                  in: query
                  required: false
                  schema:
                      type: string
                      enum: ['true', 'false']
                  description: When `true`, returns completed tasks. Otherwise old completed tasks are excluded.
                - name: date
                  in: query
                  required: false
                  schema:
                      type: string
                      format: date
                  description: Filters by due date or revised due date.
                - name: project
                  in: query
                  required: false
                  schema:
                      type: string
                - name: employee_name
                  in: query
                  required: false
                  schema:
                      type: string
                - $ref: '#/components/parameters/Page'
                - $ref: '#/components/parameters/PageSize'
            responses:
                '200':
                    description: Paginated task list.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/PaginatedTasksResponse'
                '403':
                    $ref: '#/components/responses/Forbidden'

    /tasks/{task_id}/:
        parameters:
            - $ref: '#/components/parameters/TaskId'
        patch:
            tags: [Tasks]
            summary: Update task
            operationId: updateTask
            description: Requires Admin or permitted Team Member access.
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/TaskUpdateRequest'
            responses:
                '200':
                    description: Task updated successfully.
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessResponse'
                                    - type: object
                                      properties:
                                          data:
                                              $ref: '#/components/schemas/Task'
                '400':
                    $ref: '#/components/responses/ValidationError'
                '404':
                    $ref: '#/components/responses/NotFound'
        delete:
            tags: [Tasks]
            summary: Delete task
            operationId: deleteTask
            description: Requires Admin or permitted Team Member access.
            responses:
                '200':
                    $ref: '#/components/responses/Success'
                '404':
                    $ref: '#/components/responses/NotFound'

    /tasks/my-tasks/:
        get:
            tags: [Tasks]
            summary: List current user's assigned tasks
            operationId: listMyTasks
            parameters:
                - $ref: '#/components/parameters/Search'
            responses:
                '200':
                    description: Assigned task list.
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessResponse'
                                    - type: object
                                      properties:
                                          data:
                                              type: array
                                              items:
                                                  $ref: '#/components/schemas/Task'

    /tasks/update-status/{task_id}/:
        parameters:
            - $ref: '#/components/parameters/TaskId'
        patch:
            tags: [Tasks]
            summary: Update assigned task status
            operationId: updateAssignedTaskStatus
            description: Assigned Team Members can update status, except to `COMPLETED`.
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/TaskStatusUpdateRequest'
            responses:
                '200':
                    description: Task status updated successfully.
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessResponse'
                                    - type: object
                                      properties:
                                          data:
                                              type: object
                                              properties:
                                                  status:
                                                      $ref: '#/components/schemas/TaskStatus'
                '400':
                    $ref: '#/components/responses/ValidationError'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    $ref: '#/components/responses/NotFound'

    /tasks/progress/:
        get:
            tags: [Tasks]
            summary: Global task progress
            operationId: listTaskProgress
            description: Requires Super Admin access.
            parameters:
                - $ref: '#/components/parameters/Search'
            responses:
                '200':
                    description: Global task list.
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessResponse'
                                    - type: object
                                      properties:
                                          data:
                                              type: array
                                              items:
                                                  $ref: '#/components/schemas/Task'
                '403':
                    $ref: '#/components/responses/Forbidden'

    /tasks/{task_id}/detail/:
        parameters:
            - $ref: '#/components/parameters/TaskId'
        get:
            tags: [Tasks]
            summary: Fetch full task detail
            operationId: getTaskDetail
            description: Returns task, comments, and subtasks for task participants or Super Admins.
            responses:
                '200':
                    description: Task detail fetched.
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessResponse'
                                    - type: object
                                      properties:
                                          data:
                                              $ref: '#/components/schemas/TaskDetail'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    $ref: '#/components/responses/NotFound'

    /tasks/{task_id}/comments/:
        parameters:
            - $ref: '#/components/parameters/TaskId'
        get:
            tags: [Comments]
            summary: List task comments
            operationId: listTaskComments
            responses:
                '200':
                    description: Comments fetched.
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessResponse'
                                    - type: object
                                      properties:
                                          data:
                                              type: array
                                              items:
                                                  $ref: '#/components/schemas/TaskComment'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    $ref: '#/components/responses/NotFound'
        post:
            tags: [Comments]
            summary: Create task comment
            operationId: createTaskComment
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/TaskCommentCreateRequest'
            responses:
                '201':
                    description: Comment added.
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessResponse'
                                    - type: object
                                      properties:
                                          data:
                                              $ref: '#/components/schemas/TaskComment'
                '400':
                    $ref: '#/components/responses/ValidationError'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    $ref: '#/components/responses/NotFound'

    /tasks/{task_id}/subtasks/:
        parameters:
            - $ref: '#/components/parameters/TaskId'
        get:
            tags: [Subtasks]
            summary: List task subtasks
            operationId: listSubtasks
            responses:
                '200':
                    description: Subtasks fetched.
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessResponse'
                                    - type: object
                                      properties:
                                          data:
                                              type: array
                                              items:
                                                  $ref: '#/components/schemas/SubTask'
                '404':
                    $ref: '#/components/responses/NotFound'
        post:
            tags: [Subtasks]
            summary: Create subtask
            operationId: createSubtask
            description: Requires Admin or permitted Team Member access.
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/SubTaskCreateRequest'
            responses:
                '201':
                    description: Subtask created.
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessResponse'
                                    - type: object
                                      properties:
                                          data:
                                              $ref: '#/components/schemas/SubTask'
                '400':
                    $ref: '#/components/responses/ValidationError'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    $ref: '#/components/responses/NotFound'

    /tasks/{task_id}/subtasks/{subtask_id}/:
        parameters:
            - $ref: '#/components/parameters/TaskId'
            - $ref: '#/components/parameters/SubTaskId'
        patch:
            tags: [Subtasks]
            summary: Update subtask completion
            operationId: updateSubtask
            description: If `is_completed` is omitted, the backend toggles the current value.
            requestBody:
                required: false
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/SubTaskUpdateRequest'
            responses:
                '200':
                    description: Subtask updated.
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessResponse'
                                    - type: object
                                      properties:
                                          data:
                                              $ref: '#/components/schemas/SubTask'
                '404':
                    $ref: '#/components/responses/NotFound'
        delete:
            tags: [Subtasks]
            summary: Delete subtask
            operationId: deleteSubtask
            description: Requires Admin or permitted Team Member access.
            responses:
                '200':
                    $ref: '#/components/responses/Success'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    $ref: '#/components/responses/NotFound'

    /timesheets/create/:
        post:
            tags: [Timesheets]
            summary: Create timesheet
            operationId: createTimesheet
            description: Current user must be assigned to the task.
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/TimesheetCreateRequest'
            responses:
                '201':
                    description: Timesheet created successfully.
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessResponse'
                                    - type: object
                                      properties:
                                          data:
                                              $ref: '#/components/schemas/Timesheet'
                '400':
                    $ref: '#/components/responses/ValidationError'

    /timesheets/{timesheet_id}/:
        parameters:
            - $ref: '#/components/parameters/TimesheetId'
        patch:
            tags: [Timesheets]
            summary: Update timesheet
            operationId: patchTimesheet
            description: Only the owner can update, and only within 24 hours of creation.
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/TimesheetUpdateRequest'
            responses:
                '200':
                    description: Timesheet updated successfully.
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessResponse'
                                    - type: object
                                      properties:
                                          data:
                                              $ref: '#/components/schemas/TimesheetUpdateRequest'
                '400':
                    $ref: '#/components/responses/ValidationError'
                '404':
                    $ref: '#/components/responses/NotFound'
        put:
            tags: [Timesheets]
            summary: Replace/update timesheet
            operationId: putTimesheet
            description: Same backend behavior as PATCH.
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/TimesheetUpdateRequest'
            responses:
                '200':
                    description: Timesheet updated successfully.
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessResponse'
                                    - type: object
                                      properties:
                                          data:
                                              $ref: '#/components/schemas/TimesheetUpdateRequest'
                '400':
                    $ref: '#/components/responses/ValidationError'
                '404':
                    $ref: '#/components/responses/NotFound'

    /timesheets/admin/:
        get:
            tags: [Timesheets]
            summary: List Admin team timesheets
            operationId: listAdminTimesheets
            parameters:
                - $ref: '#/components/parameters/Date'
                - $ref: '#/components/parameters/StartDate'
                - $ref: '#/components/parameters/EndDate'
                - $ref: '#/components/parameters/TaskName'
                - $ref: '#/components/parameters/ProjectName'
                - $ref: '#/components/parameters/EmployeeName'
                - $ref: '#/components/parameters/Page'
                - $ref: '#/components/parameters/PageSize'
            responses:
                '200':
                    description: Paginated Admin timesheet list.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/PaginatedTimesheetsResponse'
                '403':
                    $ref: '#/components/responses/Forbidden'

    /timesheets/super-admin/:
        get:
            tags: [Timesheets]
            summary: List all timesheets
            operationId: listSuperAdminTimesheets
            parameters:
                - $ref: '#/components/parameters/Date'
                - $ref: '#/components/parameters/StartDate'
                - $ref: '#/components/parameters/EndDate'
                - $ref: '#/components/parameters/TaskName'
                - $ref: '#/components/parameters/ProjectName'
                - $ref: '#/components/parameters/EmployeeName'
                - $ref: '#/components/parameters/Page'
                - $ref: '#/components/parameters/PageSize'
            responses:
                '200':
                    description: Paginated global timesheet list.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/PaginatedTimesheetsResponse'
                '403':
                    $ref: '#/components/responses/Forbidden'

    /timesheets/my-timesheets/:
        get:
            tags: [Timesheets]
            summary: List current user's timesheets
            operationId: listMyTimesheets
            parameters:
                - $ref: '#/components/parameters/Date'
                - $ref: '#/components/parameters/StartDate'
                - $ref: '#/components/parameters/EndDate'
                - $ref: '#/components/parameters/TaskName'
                - $ref: '#/components/parameters/ProjectName'
                - $ref: '#/components/parameters/EmployeeName'
                - $ref: '#/components/parameters/Page'
                - $ref: '#/components/parameters/PageSize'
            responses:
                '200':
                    description: Paginated current-user timesheet list.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/PaginatedTimesheetsResponse'

    /notifications/:
        get:
            tags: [Notifications]
            summary: List notifications
            operationId: listNotifications
            parameters:
                - name: unread
                  in: query
                  required: false
                  schema:
                      type: boolean
                  description: When true, returns only unread notifications.
                - $ref: '#/components/parameters/Page'
                - $ref: '#/components/parameters/PageSize'
            responses:
                '200':
                    description: Paginated notification list.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/PaginatedNotificationsResponse'

    /notifications/unread-count/:
        get:
            tags: [Notifications]
            summary: Get unread notification count
            operationId: getUnreadNotificationCount
            responses:
                '200':
                    description: Unread count fetched.
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessResponse'
                                    - type: object
                                      properties:
                                          data:
                                              type: object
                                              properties:
                                                  count:
                                                      type: integer
                                                      example: 3

    /notifications/{notification_id}/read/:
        parameters:
            - $ref: '#/components/parameters/NotificationId'
        patch:
            tags: [Notifications]
            summary: Mark notification as read
            operationId: markNotificationRead
            responses:
                '200':
                    description: Notification marked as read.
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessResponse'
                                    - type: object
                                      properties:
                                          data:
                                              $ref: '#/components/schemas/Notification'
                '404':
                    $ref: '#/components/responses/NotFound'

    /notifications/mark-all-read/:
        patch:
            tags: [Notifications]
            summary: Mark all notifications as read
            operationId: markAllNotificationsRead
            responses:
                '200':
                    description: Notifications marked as read.
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessResponse'
                                    - type: object
                                      properties:
                                          data:
                                              type: object
                                              properties:
                                                  updated:
                                                      type: integer
                                                      example: 7

    /announcements/create/:
        post:
            tags: [Announcements]
            summary: Create announcement
            operationId: createAnnouncement
            description: Super Admin can target `ADMINS_ONLY` or `ALL`; Admin can target `MY_TEAM`.
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/AnnouncementCreateRequest'
            responses:
                '201':
                    description: Announcement created successfully.
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessResponse'
                                    - type: object
                                      properties:
                                          data:
                                              $ref: '#/components/schemas/Announcement'
                '400':
                    $ref: '#/components/responses/ValidationError'
                '403':
                    $ref: '#/components/responses/Forbidden'

    /announcements/:
        get:
            tags: [Announcements]
            summary: List visible announcements
            operationId: listAnnouncements
            parameters:
                - name: title
                  in: query
                  required: false
                  schema:
                      type: string
                  description: Case-insensitive title filter.
                - $ref: '#/components/parameters/Page'
                - $ref: '#/components/parameters/PageSize'
            responses:
                '200':
                    description: Paginated announcement list.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/PaginatedAnnouncementsResponse'

    /announcements/{announcement_id}/:
        parameters:
            - $ref: '#/components/parameters/AnnouncementId'
        put:
            tags: [Announcements]
            summary: Update announcement
            operationId: updateAnnouncement
            description: Only the announcement sender can update it.
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/AnnouncementUpdateRequest'
            responses:
                '200':
                    description: Announcement updated successfully.
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessResponse'
                                    - type: object
                                      properties:
                                          data:
                                              $ref: '#/components/schemas/Announcement'
                '400':
                    $ref: '#/components/responses/ValidationError'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    $ref: '#/components/responses/NotFound'
        delete:
            tags: [Announcements]
            summary: Delete announcement
            operationId: deleteAnnouncement
            description: Only the announcement sender can delete it.
            responses:
                '200':
                    $ref: '#/components/responses/Success'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    $ref: '#/components/responses/NotFound'

    /announcements/super-admin/:
        get:
            tags: [Announcements]
            summary: List all announcements for Super Admin
            operationId: listSuperAdminAnnouncements
            parameters:
                - name: title
                  in: query
                  required: false
                  schema:
                      type: string
                - $ref: '#/components/parameters/Page'
                - $ref: '#/components/parameters/PageSize'
            responses:
                '200':
                    description: Paginated global announcement list.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/PaginatedAnnouncementsResponse'
                '403':
                    $ref: '#/components/responses/Forbidden'

components:
    securitySchemes:
        bearerAuth:
            type: http
            scheme: bearer
            bearerFormat: JWT

    parameters:
        AdminId:
            name: admin_id
            in: path
            required: true
            schema:
                type: integer
        MemberId:
            name: member_id
            in: path
            required: true
            schema:
                type: integer
        TaskId:
            name: task_id
            in: path
            required: true
            schema:
                type: integer
        SubTaskId:
            name: subtask_id
            in: path
            required: true
            schema:
                type: integer
        TimesheetId:
            name: timesheet_id
            in: path
            required: true
            schema:
                type: integer
        NotificationId:
            name: notification_id
            in: path
            required: true
            schema:
                type: integer
        AnnouncementId:
            name: announcement_id
            in: path
            required: true
            schema:
                type: integer
        Search:
            name: search
            in: query
            required: false
            schema:
                type: string
        Page:
            name: page
            in: query
            required: false
            schema:
                type: integer
                minimum: 1
        PageSize:
            name: page_size
            in: query
            required: false
            schema:
                type: integer
                minimum: 1
                maximum: 100
        Date:
            name: date
            in: query
            required: false
            schema:
                type: string
                format: date
        StartDate:
            name: start_date
            in: query
            required: false
            schema:
                type: string
                format: date-time
        EndDate:
            name: end_date
            in: query
            required: false
            schema:
                type: string
                format: date-time
        TaskName:
            name: task_name
            in: query
            required: false
            schema:
                type: string
        ProjectName:
            name: project_name
            in: query
            required: false
            schema:
                type: string
        EmployeeName:
            name: employee_name
            in: query
            required: false
            schema:
                type: string

    responses:
        Success:
            description: Operation completed successfully.
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/SuccessResponse'
        Unauthorized:
            description: Authentication failed or token is missing/invalid.
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ErrorResponse'
        Forbidden:
            description: Authenticated user does not have permission.
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ErrorResponse'
        NotFound:
            description: Resource was not found.
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ErrorResponse'
        ValidationError:
            description: Request validation failed.
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ErrorResponse'

    schemas:
        SuccessResponse:
            type: object
            required: [isV1, success, message, data]
            properties:
                isV1:
                    type: boolean
                    example: true
                success:
                    type: boolean
                    example: true
                message:
                    type: string
                    example: Success
                data:
                    nullable: true

        ErrorResponse:
            type: object
            required: [isV1, success, message]
            properties:
                isV1:
                    type: boolean
                    example: true
                success:
                    type: boolean
                    example: false
                message:
                    type: string
                    example: Validation failed
                errors:
                    nullable: true

        PaginatedResponseBase:
            type: object
            required: [count, next, previous, results]
            properties:
                count:
                    type: integer
                    example: 25
                next:
                    type: string
                    nullable: true
                    example: http://localhost:8000/api/tasks/admin/?page=2
                previous:
                    type: string
                    nullable: true
                    example: null

        PaginatedAdminUsersResponse:
            allOf:
                - $ref: '#/components/schemas/PaginatedResponseBase'
                - type: object
                  properties:
                      results:
                          allOf:
                              - $ref: '#/components/schemas/SuccessResponse'
                              - type: object
                                properties:
                                    data:
                                        type: array
                                        items:
                                            $ref: '#/components/schemas/AdminUser'

        PaginatedTeamMembersResponse:
            allOf:
                - $ref: '#/components/schemas/PaginatedResponseBase'
                - type: object
                  properties:
                      results:
                          allOf:
                              - $ref: '#/components/schemas/SuccessResponse'
                              - type: object
                                properties:
                                    data:
                                        type: array
                                        items:
                                            $ref: '#/components/schemas/TeamMember'

        PaginatedTasksResponse:
            allOf:
                - $ref: '#/components/schemas/PaginatedResponseBase'
                - type: object
                  properties:
                      results:
                          allOf:
                              - $ref: '#/components/schemas/SuccessResponse'
                              - type: object
                                properties:
                                    data:
                                        type: array
                                        items:
                                            $ref: '#/components/schemas/Task'

        PaginatedTimesheetsResponse:
            allOf:
                - $ref: '#/components/schemas/PaginatedResponseBase'
                - type: object
                  properties:
                      results:
                          allOf:
                              - $ref: '#/components/schemas/SuccessResponse'
                              - type: object
                                properties:
                                    data:
                                        type: array
                                        items:
                                            $ref: '#/components/schemas/Timesheet'

        PaginatedNotificationsResponse:
            allOf:
                - $ref: '#/components/schemas/PaginatedResponseBase'
                - type: object
                  properties:
                      results:
                          allOf:
                              - $ref: '#/components/schemas/SuccessResponse'
                              - type: object
                                properties:
                                    data:
                                        type: array
                                        items:
                                            $ref: '#/components/schemas/Notification'

        PaginatedAnnouncementsResponse:
            allOf:
                - $ref: '#/components/schemas/PaginatedResponseBase'
                - type: object
                  properties:
                      results:
                          allOf:
                              - $ref: '#/components/schemas/SuccessResponse'
                              - type: object
                                properties:
                                    data:
                                        type: array
                                        items:
                                            $ref: '#/components/schemas/Announcement'

        SuperAdminLoginRequest:
            type: object
            required: [username, password]
            properties:
                username:
                    type: string
                    example: superadmin
                password:
                    type: string
                    format: password

        LoginRequest:
            type: object
            required: [user_name, password]
            properties:
                user_name:
                    type: string
                    example: admin01
                password:
                    type: string
                    format: password

        TokenPair:
            type: object
            required: [refresh, access]
            properties:
                refresh:
                    type: string
                access:
                    type: string

        AuthData:
            type: object
            required: [role, tokens]
            properties:
                role:
                    $ref: '#/components/schemas/UserRole'
                tokens:
                    $ref: '#/components/schemas/TokenPair'

        AuthResponse:
            allOf:
                - $ref: '#/components/schemas/SuccessResponse'
                - type: object
                  properties:
                      data:
                          $ref: '#/components/schemas/AuthData'

        UserRole:
            type: string
            enum: [SUPER_ADMIN, ADMIN, TEAM_MEMBER]

        TaskStatus:
            type: string
            enum: [PENDING, IN_PROGRESS, HOLD, IN_REVIEW, COMPLETED]

        TaskPriority:
            type: string
            enum: [LOW, MEDIUM, HIGH]

        AnnouncementAudience:
            type: string
            enum: [ADMINS_ONLY, ALL, MY_TEAM]

        CreateUserRequest:
            type: object
            required: [user_name, password, email]
            properties:
                user_name:
                    type: string
                    example: jane.doe
                password:
                    type: string
                    format: password
                email:
                    type: string
                    format: email
                    example: jane.doe@example.com

        UserUpdateRequest:
            type: object
            properties:
                user_name:
                    type: string
                email:
                    type: string
                    format: email
                phone_number:
                    type: integer
                    nullable: true
                    example: 9876543210

        SuperAdminTeamMemberUpdateRequest:
            allOf:
                - $ref: '#/components/schemas/UserUpdateRequest'
                - type: object
                  properties:
                      can_crud_tasks:
                          type: boolean

        UserCreated:
            type: object
            properties:
                id:
                    type: integer
                username:
                    type: string
                role:
                    $ref: '#/components/schemas/UserRole'

        UserSummary:
            type: object
            properties:
                id:
                    type: integer
                username:
                    type: string
                email:
                    type: string
                    format: email
                    nullable: true
                name:
                    type: string
                profile_picture:
                    type: string
                    nullable: true

        TeamLeaderSummary:
            type: object
            nullable: true
            properties:
                id:
                    type: integer
                username:
                    type: string
                name:
                    type: string
                profile_picture:
                    type: string
                    nullable: true
                role:
                    $ref: '#/components/schemas/UserRole'

        AdminUser:
            type: object
            properties:
                id:
                    type: integer
                username:
                    type: string
                email:
                    type: string
                    format: email
                    nullable: true
                phone_number:
                    type: integer
                    nullable: true
                role:
                    $ref: '#/components/schemas/UserRole'

        TeamMember:
            allOf:
                - $ref: '#/components/schemas/AdminUser'
                - type: object
                  properties:
                      name:
                          type: string
                      employee_id:
                          type: string
                          nullable: true
                      profile_picture:
                          type: string
                          nullable: true
                      created_by:
                          type: string
                          nullable: true
                      can_crud_tasks:
                          type: boolean

        Profile:
            type: object
            properties:
                id:
                    type: integer
                username:
                    type: string
                role:
                    $ref: '#/components/schemas/UserRole'
                name:
                    type: string
                employee_id:
                    type: string
                profile_picture:
                    type: string
                can_crud_tasks:
                    type: boolean

        ProfileUpdateRequest:
            type: object
            properties:
                name:
                    type: string
                employee_id:
                    type: string
                profile_picture:
                    type: string
                    description: Base64 or URL string stored by the frontend.
                password:
                    type: string
                    format: password

        TaskCreateRequest:
            type: object
            required:
                [project_name, task_name, description, due_date, assignee_ids]
            properties:
                project_name:
                    type: string
                    example: Mobile App
                task_name:
                    type: string
                    example: Build login screen
                description:
                    type: string
                priority:
                    $ref: '#/components/schemas/TaskPriority'
                status:
                    $ref: '#/components/schemas/TaskStatus'
                due_date:
                    type: string
                    format: date
                revised_due_date:
                    type: string
                    format: date
                    nullable: true
                remarks:
                    type: string
                    nullable: true
                assignee_ids:
                    type: array
                    minItems: 1
                    items:
                        type: integer

        TaskUpdateRequest:
            type: object
            properties:
                project_name:
                    type: string
                task_name:
                    type: string
                description:
                    type: string
                priority:
                    $ref: '#/components/schemas/TaskPriority'
                status:
                    $ref: '#/components/schemas/TaskStatus'
                due_date:
                    type: string
                    format: date
                revised_due_date:
                    type: string
                    format: date
                    nullable: true
                remarks:
                    type: string
                    nullable: true
                assignee_ids:
                    type: array
                    items:
                        type: integer

        TaskStatusUpdateRequest:
            type: object
            required: [status]
            properties:
                status:
                    $ref: '#/components/schemas/TaskStatus'

        Task:
            type: object
            properties:
                id:
                    type: integer
                project_name:
                    type: string
                task_name:
                    type: string
                description:
                    type: string
                assignees:
                    type: array
                    items:
                        $ref: '#/components/schemas/UserSummary'
                assigned_by:
                    $ref: '#/components/schemas/UserSummary'
                team_leader:
                    $ref: '#/components/schemas/TeamLeaderSummary'
                status:
                    $ref: '#/components/schemas/TaskStatus'
                priority:
                    $ref: '#/components/schemas/TaskPriority'
                due_date:
                    type: string
                    format: date
                revised_due_date:
                    type: string
                    format: date
                    nullable: true
                remarks:
                    type: string
                    nullable: true
                created_at:
                    type: string
                    format: date-time
                updated_at:
                    type: string
                    format: date-time

        TaskDetail:
            allOf:
                - $ref: '#/components/schemas/Task'
                - type: object
                  properties:
                      comments:
                          type: array
                          items:
                              $ref: '#/components/schemas/TaskComment'
                      subtasks:
                          type: array
                          items:
                              $ref: '#/components/schemas/SubTask'

        TaskCommentCreateRequest:
            type: object
            required: [content]
            properties:
                content:
                    type: string
                    example: Completed initial review.

        TaskComment:
            type: object
            properties:
                id:
                    type: integer
                user:
                    type: object
                    properties:
                        id:
                            type: integer
                        username:
                            type: string
                        name:
                            type: string
                        profile_picture:
                            type: string
                            nullable: true
                content:
                    type: string
                created_at:
                    type: string
                    format: date-time

        SubTaskCreateRequest:
            type: object
            required: [title]
            properties:
                title:
                    type: string
                    example: Prepare UI mockup

        SubTaskUpdateRequest:
            type: object
            properties:
                is_completed:
                    type: boolean

        SubTask:
            type: object
            properties:
                id:
                    type: integer
                title:
                    type: string
                is_completed:
                    type: boolean
                created_at:
                    type: string
                    format: date-time

        TimesheetCreateRequest:
            type: object
            required: [task_id, description, status, start_time, end_time]
            properties:
                task_id:
                    type: integer
                description:
                    type: string
                status:
                    $ref: '#/components/schemas/TaskStatus'
                start_time:
                    type: string
                    format: date-time
                end_time:
                    type: string
                    format: date-time

        TimesheetUpdateRequest:
            type: object
            properties:
                description:
                    type: string
                status:
                    $ref: '#/components/schemas/TaskStatus'
                start_time:
                    type: string
                    format: date-time
                end_time:
                    type: string
                    format: date-time

        TimesheetTask:
            type: object
            properties:
                id:
                    type: integer
                project_name:
                    type: string
                task_name:
                    type: string
                priority:
                    $ref: '#/components/schemas/TaskPriority'
                assigned_by:
                    $ref: '#/components/schemas/UserSummary'
                assignees:
                    type: array
                    items:
                        $ref: '#/components/schemas/UserSummary'
                team_leader:
                    $ref: '#/components/schemas/TeamLeaderSummary'

        Timesheet:
            type: object
            properties:
                id:
                    type: integer
                task:
                    $ref: '#/components/schemas/TimesheetTask'
                team_member:
                    $ref: '#/components/schemas/UserSummary'
                team_leader:
                    $ref: '#/components/schemas/TeamLeaderSummary'
                description:
                    type: string
                status:
                    $ref: '#/components/schemas/TaskStatus'
                start_time:
                    type: string
                    format: date-time
                end_time:
                    type: string
                    format: date-time
                working_hours:
                    type: string
                    nullable: true
                    example: '1.50'
                priority:
                    $ref: '#/components/schemas/TaskPriority'
                created_at:
                    type: string
                    format: date-time
                updated_at:
                    type: string
                    format: date-time

        Notification:
            type: object
            properties:
                id:
                    type: integer
                sender:
                    type: object
                    properties:
                        id:
                            type: integer
                        username:
                            type: string
                        name:
                            type: string
                        profile_picture:
                            type: string
                            nullable: true
                task_info:
                    type: object
                    nullable: true
                    properties:
                        id:
                            type: integer
                        task_name:
                            type: string
                        project_name:
                            type: string
                message:
                    type: string
                is_read:
                    type: boolean
                created_at:
                    type: string
                    format: date-time

        AnnouncementCreateRequest:
            type: object
            required: [title, message, audience]
            properties:
                title:
                    type: string
                message:
                    type: string
                audience:
                    $ref: '#/components/schemas/AnnouncementAudience'

        AnnouncementUpdateRequest:
            type: object
            required: [title, message]
            properties:
                title:
                    type: string
                message:
                    type: string

        Announcement:
            type: object
            properties:
                id:
                    type: integer
                sender:
                    type: object
                    properties:
                        id:
                            type: integer
                        username:
                            type: string
                        name:
                            type: string
                        profile_picture:
                            type: string
                            nullable: true
                        role:
                            $ref: '#/components/schemas/UserRole'
                title:
                    type: string
                message:
                    type: string
                audience:
                    $ref: '#/components/schemas/AnnouncementAudience'
                created_at:
                    type: string
                    format: date-time
                updated_at:
                    type: string
                    format: date-time

security:
    - bearerAuth: []
